name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App tests
        run: npm test
      - name: Sandbox tests
        run: npm test
        working-directory: sandbox
      - name: Build
        run: npm run build
